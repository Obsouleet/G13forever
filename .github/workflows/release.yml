# Ein Versions-Tag (v1.2.3, v1.2 oder ohne v) baut die App für Apple silicon und
# Intel (ad-hoc signiert) und hängt sie als G13forever.zip an das Release dieses Tags.
# Für ein schon vorhandenes Tag: auf der Actions-Seite "Run workflow".
name: Release

on:
  push:
    tags: ['v[0-9]*', '[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Vorhandenes Tag, z. B. v1.2.3
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Tag prüfen
        run: |
          if [[ ! "$TAG" =~ ^v?[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "::error::$TAG ist keine Versionsnummer wie v1.2.3"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Tests
        run: swift test
      - name: App bauen und packen
        run: UNIVERSAL=1 ZIP=1 VERSION="${TAG#v}" scripts/build-app.sh
      - name: Release veröffentlichen
        # Wurde das Release schon auf der Website angelegt, kommt nur die Datei dazu.
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/G13forever.zip --clobber
            exit
          fi
          cat > notes.md <<'NOTES'
          Download **G13forever.zip** below (Apple silicon and Intel, macOS 14 or newer).
          The app is not notarized by Apple. How to open it the first time, and what to do
          after an update: [install guide](https://github.com/Obsouleet/G13forever#download).
          NOTES
          gh release create "$TAG" build/G13forever.zip --verify-tag \
            --title "G13forever ${TAG#v}" --generate-notes --notes-file notes.md
