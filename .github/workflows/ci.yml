name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Swift-Version
        run: swift --version
      - name: Bauen
        run: swift build
      - name: Tests
        run: swift test
      - name: Vorschau (ohne Hardware)
        run: |
          swift run g13ctl preview --pattern
          swift run g13ctl preview --text "Hallo G13"
