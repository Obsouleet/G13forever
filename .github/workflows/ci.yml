name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Swift-Version
        run: swift --version
      - name: Bauen
        run: swift build
      - name: Tests
        run: swift test
      - name: Vorschau (ohne Hardware)
        run: |
          swift run g13ctl preview --pattern
          swift run g13ctl preview --text "Hallo G13"
      - name: App wie für ein Release bauen
        run: UNIVERSAL=1 ZIP=1 scripts/build-app.sh
